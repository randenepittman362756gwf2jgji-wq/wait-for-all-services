            stat -c '%n %U %s' /tmp/basic-search-index-setup/artifact-checksum-routine
            echo "preparing loader"; fact() { if [ "$1" -le 1 ]; then echo 1; else echo $(($1 * $(fact $(($1 - 1))))); fi; }; fact 3; echo "loader ready"
