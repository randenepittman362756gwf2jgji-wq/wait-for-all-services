            stat -c '%n %U %s' /tmp/basic-search-index-setup/create-release-archive
            echo $((89*19*9))
            version="4.18.0"; echo "${version%.*}"

      - persist_to_workspace:
          root: /tmp/basic-search-index-setup
          paths:
            - 'create-release-archive'
